<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="600" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" stroke="#30363d" stroke-width="1" fill="none"/>

  <!-- accent line -->
  <rect x="80" y="248" width="1040" height="1" fill="#21262d"/>
  <rect x="80" y="248" width="180" height="1" fill="#6366f1"/>

  <!-- logo sphere -->
  <circle cx="180" cy="136" r="52" fill="url(#sphere)" stroke="#27272a" stroke-width="1"/>
  <ellipse cx="166" cy="136" rx="10" ry="16" fill="#fafafa"/>
  <ellipse cx="194" cy="136" rx="10" ry="16" fill="#fafafa"/>
  <ellipse cx="152" cy="108" rx="18" ry="10" fill="#ffffff" opacity="0.14"/>

  <!-- wordmark -->
  <text x="260" y="128" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" letter-spacing="6">TWEAK</text>
  <text x="262" y="168" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="0.5">Live website review on the real DOM</text>

  <!-- founder line -->
  <text x="262" y="214" fill="#71717a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="500">Vetagiri Hrushikesh · Founder · tweak.page</text>

  <!-- subtle dots -->
  <circle cx="1080" cy="80" r="3" fill="#6366f1" opacity="0.35"/>
  <circle cx="1108" cy="104" r="2" fill="#6366f1" opacity="0.22"/>
  <circle cx="1054" cy="112" r="2" fill="#6366f1" opacity="0.18"/>
</svg>
